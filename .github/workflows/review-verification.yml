name: offline evidence policy verification
on:
  push:
    paths:
      - review_evidence.py
      - tests/test_evidence_review.py
      - examples/evidence-review-policy.json
      - .github/workflows/review-verification.yml
  pull_request:
    paths:
      - review_evidence.py
      - tests/test_evidence_review.py
      - examples/evidence-review-policy.json
      - .github/workflows/review-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offline-review:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_evidence_review.py -v
