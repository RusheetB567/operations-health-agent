name: evidence catalogue verification
on:
  push:
    paths:
      - evidence_catalogue.py
      - tests/test_evidence_catalogue.py
      - .github/workflows/catalogue-verification.yml
  pull_request:
    paths:
      - evidence_catalogue.py
      - tests/test_evidence_catalogue.py
      - .github/workflows/catalogue-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  catalogue:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p test_evidence_catalogue.py -v
