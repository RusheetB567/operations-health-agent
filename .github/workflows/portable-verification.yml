name: portable investigation archive verification
on:
  push:
    paths:
      - portable_pack.py
      - archive_handoff.py
      - tests/test_portable_pack.py
      - tests/test_archive_handoff.py
      - tests/test_test_collection.py
      - .github/workflows/portable-verification.yml
  pull_request:
    paths:
      - portable_pack.py
      - archive_handoff.py
      - tests/test_portable_pack.py
      - tests/test_archive_handoff.py
      - tests/test_test_collection.py
      - .github/workflows/portable-verification.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  portable-roundtrip:
    timeout-minutes: 5
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - name: Archive roundtrip and hostile-format regressions
        run: python -m unittest discover -s tests -p test_portable_pack.py -v
      - name: Expected hashes and import receipts
        run: python -m unittest discover -s tests -p test_archive_handoff.py -v
      - name: Prevent hidden duplicate tests
        run: python -m unittest discover -s tests -p test_test_collection.py -v
