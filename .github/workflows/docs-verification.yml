name: documentation and demo verification
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  docs-and-demo:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python -m pip install -r requirements.txt
      - run: python tools/check_docs.py
      - run: python run_profile.py local-profile.example.json --check
      - run: python service_monitor.py services.example.json --check
      - run: python tools/demo_local.py
